name: Pip personality tests

on:
  push:
    branches:
      - integration/muse-pip-foundation
  pull_request:
    branches:
      - main

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with upstream sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run portable personality tests
        run: sh tests/personality/run.sh
